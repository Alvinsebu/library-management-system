spring:
  application:
    name: library-management-system
  data:
    mongodb:
      uri: mongodb://admin:password123@localhost:27017/library_db?authSource=admin
      database: library_db
      authentication-database: admin
  security:
    user:
      name: admin
      password: admin123
  jpa:
    hibernate:
      ddl-auto: update
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: "your-super-secret-key-that-should-be-very-long-and-secure-in-production"
  expiration: 86400000 # 24 hours in milliseconds

app:
  name: Library Management System
  version: 1.0.0
  description: A complete library management system with Spring Boot and MongoDB

logging:
  level:
    root: INFO
    com.libmgmt: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics,threaddump,heapdump
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  server:
    port: 9090

grpc:
  server:
    port: 9091
    max-inbound-message-size: 4194304

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
